# =====================================================================
# 净网哨兵 NetSentinel —— 巡查 watchlist 示例(watchlist.example.yaml)
# ---------------------------------------------------------------------
# 用途:运营者把**自己实际掌握、有权核查**的疑似目标站点加入本表,
#       巡查调度器(netsentinel/ops/scheduler.py)按表顺序定期扫描,
#       判定需人工复核时发送一条提醒(单发不重试)。
#
# 支持两种写法(调度器自动识别,不要混用):
#
#   1) YAML 映射(推荐,即下方格式):顶层固定为 items 列表,每个条目:
#        url      必填,http(s):// 开头的完整站点地址
#        note     可选,中文备注(线索来源、加入时间、核查结论等)
#        enabled  可选,默认 true;false 时每轮跳过该条目(留档不巡查)
#
#   2) 纯文本(未安装 PyYAML 时的最小格式):每行一个 URL,
#      以 # 开头的整行是注释。
#
# 使用方法:复制为 watchlist.yaml(或把 config.yaml 的 watchlist_path
# 指向本文件),然后:
#      python -m netsentinel.ops.scheduler --list                 # 查看条目
#      python -m netsentinel.ops.scheduler --once                 # 跑一轮
#      python -m netsentinel.ops.scheduler --loop --interval-min 720  # 循环
#
# 去重说明:调度器会记住每个站点的内容指纹(默认 72 小时有效),
# 指纹未变且未过期的站点在下一轮直接跳过;需要强制重扫时删掉
# data/site_memory.db 或临时把条目 enabled 置 true 前先改 URL 备查。
#
# !!! 安全红线 !!!
#   - 请把下列占位地址**替换为运营者实际掌握的疑似目标**;
#     **禁止扫描未授权目标**——未列入本表的地址绝不会被发起扫描。
#   - 是否真实联网由配置 allow_network 把关(默认仅放行本机地址)。
# =====================================================================

items:
  # 条目 1:完整写法。note 建议记录线索来源与核查进度,便于团队交接。
  - url: https://suspect-01.example.com/
    note: "示例一:2026-09 群众来信线索,首轮全量扫描,关注图集栏目"
    enabled: true

  # 条目 2:最简可用写法也可以只写 url(note/enabled 走默认值)。
  # 这里给出完整字段以便演示:改版频繁的站点保持 enabled: true,
  # 由调度器的指纹记忆自动跳过"内容未变"的轮次,节省巡查开销。
  - url: https://suspect-02.example.com/portal/
    note: "示例二:复访站点,首页改版频繁,重点比对新增图片"
    enabled: true

  # 条目 3:停用示例。enabled: false 的条目保留在表中留档,
  # 但每一轮都会被跳过,不发起任何扫描;需要恢复巡查时改回 true。
  - url: https://suspect-03.example.com/
    note: "示例三:已举报结案,暂停巡查(留档勿删)"
    enabled: false

# ---------------------------------------------------------------------
# 纯文本最小格式示例(与上面二选一):
#
#     https://suspect-01.example.com/
#     https://suspect-02.example.com/portal/
#     # 这行是注释,会被忽略
# ---------------------------------------------------------------------
