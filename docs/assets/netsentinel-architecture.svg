<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <title id="title">NetSentinel 分层架构</title>
  <desc id="desc">L5 消费端、L4 流程、L3 编排与代理、L2 设施、L0/L1 基座的分层架构图，上层调用下层。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f9ff"/>
    </linearGradient>
    <filter id="rowShadow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="railArrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .pill rect { stroke-width: 1.4; }
      .pill text { font-size: 15px; font-weight: 700; }
      .l5 rect { fill: #eef2ff; stroke: #c7d2fe; }
      .l5 text { fill: #3730a3; }
      .l4 rect { fill: #eff6ff; stroke: #bfdbfe; }
      .l4 text { fill: #1e40af; }
      .l3 rect { fill: #ecfdf5; stroke: #99f6e4; }
      .l3 text { fill: #115e59; }
      .l2 rect { fill: #f5f3ff; stroke: #ddd6fe; }
      .l2 text { fill: #5b21b6; }
      .base rect { fill: #f1f5f9; stroke: #cbd5e1; }
      .base text { fill: #334155; }
    </style>
  </defs>

  <rect width="1280" height="620" rx="24" fill="url(#bg)" stroke="#e2e8f0"/>
  <text x="44" y="48" font-size="24" font-weight="800" fill="#0f172a">L0–L5 分层架构</text>
  <text x="44" y="75" font-size="15" fill="#64748b">上层调用下层；举报提交流水末端始终保留 HUMAN_GATE 人工门。</text>

  <line x1="70" y1="110" x2="70" y2="548" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" marker-end="url(#railArrow)"/>
  <g fill="#ffffff" stroke="#94a3b8" stroke-width="2">
    <circle cx="70" cy="135" r="8"/><circle cx="70" cy="227" r="8"/><circle cx="70" cy="319" r="8"/><circle cx="70" cy="426" r="8"/><circle cx="70" cy="535" r="8"/>
  </g>

  <g filter="url(#rowShadow)">
    <g transform="translate(112 96)">
      <rect width="1120" height="78" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="128" height="78" rx="18" fill="#eef2ff"/>
      <rect x="110" y="0" width="18" height="78" fill="#eef2ff"/>
      <text x="24" y="34" font-size="21" font-weight="800" fill="#4338ca">L5</text>
      <text x="24" y="57" font-size="13" fill="#6366f1">消费端</text>
      <g class="pill l5">
        <rect x="168" y="22" width="160" height="34" rx="11"/><text x="248" y="45" text-anchor="middle">CLI</text>
        <rect x="344" y="22" width="160" height="34" rx="11"/><text x="424" y="45" text-anchor="middle">TUI</text>
        <rect x="520" y="22" width="160" height="34" rx="11"/><text x="600" y="45" text-anchor="middle">REST</text>
        <rect x="696" y="22" width="160" height="34" rx="11"/><text x="776" y="45" text-anchor="middle">WebUI</text>
        <rect x="872" y="22" width="200" height="34" rx="11"/><text x="972" y="45" text-anchor="middle">Node 驱动</text>
      </g>
    </g>

    <g transform="translate(112 188)">
      <rect width="1120" height="78" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="128" height="78" rx="18" fill="#eff6ff"/>
      <rect x="110" y="0" width="18" height="78" fill="#eff6ff"/>
      <text x="24" y="34" font-size="21" font-weight="800" fill="#1d4ed8">L4</text>
      <text x="24" y="57" font-size="13" fill="#3b82f6">流程</text>
      <g class="pill l4">
        <rect x="168" y="22" width="160" height="34" rx="11"/><text x="248" y="45" text-anchor="middle">batchflow</text>
        <rect x="344" y="22" width="160" height="34" rx="11"/><text x="424" y="45" text-anchor="middle">finishflow</text>
        <rect x="520" y="22" width="160" height="34" rx="11"/><text x="600" y="45" text-anchor="middle">sessionflow</text>
        <rect x="696" y="22" width="160" height="34" rx="11"/><text x="776" y="45" text-anchor="middle">scheduler</text>
        <rect x="872" y="22" width="200" height="34" rx="11"/><text x="972" y="45" text-anchor="middle">discovery</text>
      </g>
    </g>

    <g transform="translate(112 280)">
      <rect width="1120" height="78" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="128" height="78" rx="18" fill="#ecfdf5"/>
      <rect x="110" y="0" width="18" height="78" fill="#ecfdf5"/>
      <text x="24" y="34" font-size="21" font-weight="800" fill="#0f766e">L3</text>
      <text x="24" y="57" font-size="13" fill="#14b8a6">编排</text>
      <g class="pill l3">
        <rect x="168" y="22" width="220" height="34" rx="11"/><text x="278" y="45" text-anchor="middle">orchestrator</text>
        <rect x="404" y="22" width="220" height="34" rx="11"/><text x="514" y="45" text-anchor="middle">agent（零自主提交）</text>
        <rect x="640" y="22" width="220" height="34" rx="11"/><text x="750" y="45" text-anchor="middle">submit / HUMAN GATE</text>
        <rect x="876" y="22" width="196" height="34" rx="11"/><text x="974" y="45" text-anchor="middle">证据池 / 频控</text>
      </g>
    </g>

    <g transform="translate(112 372)">
      <rect width="1120" height="108" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="128" height="108" rx="18" fill="#f5f3ff"/>
      <rect x="110" y="0" width="18" height="108" fill="#f5f3ff"/>
      <text x="24" y="49" font-size="21" font-weight="800" fill="#7c3aed">L2</text>
      <text x="24" y="72" font-size="13" fill="#8b5cf6">设施</text>
      <g class="pill l2">
        <rect x="168" y="18" width="220" height="34" rx="11"/><text x="278" y="41" text-anchor="middle">crawler 抓取</text>
        <rect x="404" y="18" width="220" height="34" rx="11"/><text x="514" y="41" text-anchor="middle">vision 20 家 VLM</text>
        <rect x="640" y="18" width="220" height="34" rx="11"/><text x="750" y="41" text-anchor="middle">intel 情报内核</text>
        <rect x="876" y="18" width="196" height="34" rx="11"/><text x="974" y="41" text-anchor="middle">decision 判定</text>
        <rect x="168" y="60" width="220" height="34" rx="11"/><text x="278" y="83" text-anchor="middle">evidence 证据包</text>
        <rect x="404" y="60" width="220" height="34" rx="11"/><text x="514" y="83" text-anchor="middle">security 签名审计</text>
        <rect x="640" y="60" width="220" height="34" rx="11"/><text x="750" y="83" text-anchor="middle">ops 并发 / 批量</text>
        <rect x="876" y="60" width="196" height="34" rx="11"/><text x="974" y="83" text-anchor="middle">storage 事件账本</text>
      </g>
    </g>

    <g transform="translate(112 496)">
      <rect width="1120" height="78" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="0" y="0" width="128" height="78" rx="18" fill="#f1f5f9"/>
      <rect x="110" y="0" width="18" height="78" fill="#f1f5f9"/>
      <text x="18" y="34" font-size="20" font-weight="800" fill="#475569">L0/L1</text>
      <text x="24" y="57" font-size="13" fill="#64748b">基座</text>
      <g class="pill base">
        <rect x="168" y="22" width="220" height="34" rx="11"/><text x="278" y="45" text-anchor="middle">contracts 契约基座</text>
        <rect x="404" y="22" width="220" height="34" rx="11"/><text x="514" y="45" text-anchor="middle">mathx 数值微库</text>
        <rect x="640" y="22" width="220" height="34" rx="11"/><text x="750" y="45" text-anchor="middle">timesource 时间源</text>
        <rect x="876" y="22" width="196" height="34" rx="11"/><text x="974" y="45" text-anchor="middle">telemetry 遥测</text>
      </g>
    </g>
  </g>

  <rect x="112" y="586" width="1120" height="24" rx="12" fill="#f8fafc"/>
  <text x="640" y="602" text-anchor="middle" font-size="13" fill="#64748b">治理底座：红线体系 · 冻结契约 · 事件溯源 · 签名证据 · 全链追踪 · 离线测试</text>
</svg>
