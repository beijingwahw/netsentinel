<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <title id="title">NetSentinel 净网哨兵</title>
  <desc id="desc">以网页抽样、图像识别、证据包、人工复核和辅助举报为核心的净网哨兵项目题图，右侧为盾牌与识别网络示意图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.56" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#f1f0ff"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#e0f7fa"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="shieldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.15" fill="#94a3b8" opacity="0.36"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#dots)"/>
  <circle cx="1020" cy="160" r="240" fill="url(#glowBlue)"/>
  <circle cx="760" cy="340" r="210" fill="url(#glowTeal)"/>
  <path d="M690 40 C830 5 1010 22 1190 100" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.55" stroke-dasharray="9 11"/>
  <path d="M720 330 C900 360 1080 320 1250 245" fill="none" stroke="#99f6e4" stroke-width="2" opacity="0.7" stroke-dasharray="9 11"/>

  <g transform="translate(68 54)">
    <rect x="0" y="0" width="338" height="34" rx="17" fill="#e0f2fe" stroke="#bae6fd"/>
    <circle cx="19" cy="17" r="5" fill="#0284c7"/>
    <text x="34" y="22" font-size="14" font-weight="600" fill="#075985" letter-spacing="0.5">人工辅助 · 安全默认 · 证据可审计</text>

    <text x="0" y="99" font-size="62" font-weight="800" fill="#0f172a" letter-spacing="-1">NetSentinel</text>
    <text x="3" y="142" font-size="31" font-weight="700" fill="#0f766e" letter-spacing="3">净网哨兵</text>
    <text x="0" y="186" font-size="20" fill="#475569">网页抽样 · 图像识别 · 证据包 · 人工确认 · 辅助举报</text>

    <g transform="translate(0 216)">
      <rect x="0" y="0" width="122" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="61" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">20 家 VLM</text>
      <rect x="134" y="0" width="132" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="200" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#4338ca">5 种消费端</text>
      <rect x="278" y="0" width="196" height="36" rx="18" fill="#fff7ed" stroke="#fdba74"/>
      <text x="376" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">人工门不可跳过</text>
    </g>
    <text x="0" y="286" font-size="15" fill="#64748b">机器负责初筛与准备，最终判断和提交始终由人完成。</text>
  </g>

  <g transform="translate(1010 181)" filter="url(#softShadow)">
    <circle r="154" fill="#ffffff" opacity="0.32"/>
    <circle r="126" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.75" stroke-dasharray="7 10"/>
    <circle r="96" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.8"/>
    <path d="M0 -128 C58 -102 108 -102 142 -122 V-6 C142 72 80 122 0 152 C-80 122 -142 72 -142 -6 V-122 C-108 -102 -58 -102 0 -128Z" fill="url(#shield)" stroke="url(#shieldEdge)" stroke-width="5"/>
    <path d="M0 -112 C48 -90 92 -91 124 -108 V-7 C124 58 70 105 0 132 C-70 105 -124 58 -124 -7 V-108 C-92 -91 -48 -90 0 -112Z" fill="#ffffff" opacity="0.44"/>
    <path d="M-72 4 C-40 -42 40 -42 72 4 C40 50 -40 50 -72 4Z" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="4" r="25" fill="#0f766e"/>
    <circle cx="0" cy="4" r="11" fill="#ffffff"/>
    <circle cx="7" cy="-4" r="4" fill="#99f6e4"/>
    <path d="M-42 76 L-14 100 L47 43" fill="none" stroke="#4f46e5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-size="13" font-weight="700" filter="url(#cardShadow)">
    <g transform="translate(760 78)">
      <rect width="112" height="38" rx="12" fill="#ffffff" stroke="#a7f3d0"/>
      <circle cx="18" cy="19" r="6" fill="#10b981"/>
      <text x="33" y="24" fill="#065f46">clean</text>
    </g>
    <g transform="translate(1160 92)">
      <rect width="112" height="38" rx="12" fill="#ffffff" stroke="#fde68a"/>
      <circle cx="18" cy="19" r="6" fill="#f59e0b"/>
      <text x="33" y="24" fill="#92400e">suspect</text>
    </g>
    <g transform="translate(1180 272)">
      <rect width="92" height="38" rx="12" fill="#ffffff" stroke="#fecaca"/>
      <circle cx="18" cy="19" r="6" fill="#ef4444"/>
      <text x="33" y="24" fill="#991b1b">nsfw</text>
    </g>
    <g transform="translate(742 286)">
      <rect width="134" height="42" rx="13" fill="#0f172a"/>
      <text x="67" y="26" text-anchor="middle" fill="#ffffff" letter-spacing="1">HUMAN GATE</text>
    </g>
  </g>

  <g stroke="#38bdf8" stroke-width="1.8" opacity="0.65">
    <path d="M812 116 L878 150"/>
    <path d="M1160 130 L1130 158"/>
    <path d="M1180 272 L1132 250"/>
    <path d="M876 286 L898 248"/>
  </g>
  <g fill="#0ea5e9">
    <circle cx="812" cy="116" r="4"/><circle cx="878" cy="150" r="4"/>
    <circle cx="1160" cy="130" r="4"/><circle cx="1130" cy="158" r="4"/>
    <circle cx="1180" cy="272" r="4"/><circle cx="1132" cy="250" r="4"/>
    <circle cx="876" cy="286" r="4"/><circle cx="898" cy="248" r="4"/>
  </g>
</svg>
